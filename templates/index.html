    <script defer>
        console.log("Javascript started")
        // Connexion au serveur
        const socket = io.connect('http://'+document.domain+':'+location.port);
        console.log(location.pathname)



        //-------------------------Definition Variables----------------------------------
        var Pseudo=""
        var Focused= false
        var FocusTarget= null
        var SelectedCellule= null
        var SelectedUtility= null

        var anonymousInfos= document.getElementById("anonymous-infos")

        var menuButton= document.getElementById("menu-button")
        var menu= document.getElementById("menu")
        var playButton= document.getElementById("play-button")
        var menuDifficulte= document.getElementById("menu-difficulte")
        var difficulteFacile= document.getElementById("difficulte-facile")
        var difficulteMoyen= document.getElementById("difficulte-moyen")
        var difficulteDifficile= document.getElementById("difficulte-difficile")
        var difficulteExtreme= document.getElementById("difficulte-extreme")
        var difficulteGodmode= document.getElementById("difficulte-godmode")
        var loginButton= document.getElementById("login-button")
        var logoutButton= document.getElementById("logout-button")

        var loginPseudo= document.getElementById("login-pseudo")
        var loginPassword= document.getElementById("login-password")
        var loginSubmit= document.getElementById("login-submit")
        var sudokuFrame= document.getElementById("sudoku-frame")
        var values1= document.getElementById("values-1")
        var values2= document.getElementById("values-2")
        var values3= document.getElementById("values-3")
        var values4= document.getElementById("values-4")
        var values5= document.getElementById("values-5")
        var values6= document.getElementById("values-6")
        var values7= document.getElementById("values-7")
        var values8= document.getElementById("values-8")
        var values9= document.getElementById("values-9")

        var candidates7= document.getElementById("candidates-7")
        var candidates8= document.getElementById("candidates-8")

        //-------------------------Autres----------------------------------
        function removeBlur(target){
            if (target.classList.contains("blured")){target.classList.remove("blured")}
            if (target.classList.contains("focusedElement")){target.classList.remove("focusedElement")}
            if (target.classList.contains("focusedParent")){target.classList.remove("focusedParent")}
            for (let i=0; i<target.children.length;i++){
                removeBlur(target.children[i])
            }
        }

        function FocusOn(target, buttonList){
            Focused=true
            FocusTarget=target
            targets= [target]
            targets= targets.concat(buttonList)
            targets.forEach(t =>{t.classList.add("focusedElement")})
            targets.forEach(t => {
                t.classList.add("focusedElement")
                let parent= t.parentElement
                
                while (parent!=document.body.parentElement){
                    parent.classList.add("focusedParent")
                    parent.classList.remove("blured")
                    for (let i=0; i<parent.children.length; i++) {
                        if (!(parent.children[i].classList.contains("focusedParent") || parent.children[i].classList.contains("focusedElement"))){
                            parent.children[i].classList.add("blured")
                        }
                    }
                    parent= parent.parentElement
                }
            });
        }

        function FocusOff(){
            Focused=false
            FocusTarget=null
            removeBlur(document.body)
        }

        function FocusLock(fonction, targetToVerify, ...args){
            if (!Focused || (targetToVerify!=null && FocusTarget==targetToVerify)){ //revient à faire :
            // 'if (!Focused)' si il n'y a pas de target à verifier
            // 'if (!Focused || FocusTarget==targetToVerify)' sinon
                fonction(...args)
            }
        }

        //-------------------------Interaction Interfaces----------------------------------
        function CloseInfos(){
            anonymousInfos.setAttribute("hidden", "")
        }

        function OpenMenu(){
            if (menu.hasAttribute("hidden")){
                menu.removeAttribute("hidden")
                menuButton.innerText= ">"
            } else{
                menu.setAttribute("hidden", "")
                menuButton.innerText= "<"
            }
        }

        function ChooseDifficulte(){
            if (menuDifficulte.hasAttribute("hidden")){
                menuDifficulte.removeAttribute("hidden")
                playButton.innerText="Annuler"
                if (Pseudo==""){
                    if (anonymousInfos.hasAttribute("hidden")){anonymousInfos.removeAttribute("hidden")}
                }
            } else{
                menuDifficulte.setAttribute("hidden", "")
                playButton.innerText="Nouvelle Partie"
            }
        }

        function OpenLogin(){
            if (loginMenu.hasAttribute("hidden")){
                FocusOn(loginMenu, [loginButton])
                loginMenu.removeAttribute("hidden")
                loginButton.innerText="Annuler"
            } else{
                FocusOff()
                loginMenu.setAttribute("hidden", "")
                loginButton.innerText="Connexion"
            }
        }

        function Login(){
            if (loginPseudo.value!=""){
                FocusOff()
                Pseudo=loginPseudo.value
                loginPseudo.value=""
                loginMenu.setAttribute("hidden", "")
                loginButton.setAttribute("hidden", "")
                logoutButton.removeAttribute("hidden")
                loginButton.innerText="Connexion"
                CloseInfos()
            }
        }

        function Logout(){
            Pseudo=""
            logoutButton.setAttribute("hidden", "")
            loginButton.removeAttribute("hidden")
        }



        //-------------------------Fonctions de jeu----------------------------------
        function Play(difficulte){
            socket.emit('play', difficulte)
            ChooseDifficulte()
        }

        function AddValue(pos, value){
            socket.emit('add', {'pos': pos, 'type': "value", 'value': value})
        }

        function AddCandidate(pos, candidate){
            socket.emit('add', {'pos': pos, 'type': "candidate", 'value': candidate})
        }



        //-------------------------Interaction Cellules----------------------------------
        function ColorRegions(cellule, type="color"){
            let index= parseInt(cellule.id.slice(8))
            grille= document.getElementById("sudoku-grid")
            zone= cellule.parentElement
            for (let i=0; i<zone.children.length; i++){
                let rowFirstIndex= index - (index%zone.children.length)
                let colFirstIndex= index%zone.children.length
                let zoneChild= zone.children[i]
                let rowChild= document.getElementById("cellule-"+(rowFirstIndex+i))
                let colChild= document.getElementById("cellule-"+(colFirstIndex+i*zone.children.length))
                if (type=="color"){ //colore les cases
                    if (zoneChild!=cellule){
                        zoneChild.classList.add("bg-blue-100/50")
                        zoneChild.classList.add("hover:bg-blue-200/50")
                        zoneChild.classList.remove("hover:bg-neutral-100")
                    }

                    if (!rowChild.classList.contains("bg-blue-100/50") && rowChild!=cellule){
                        rowChild.classList.add("bg-blue-100/50")
                        rowChild.classList.add("hover:bg-blue-200/50")
                        rowChild.classList.remove("hover:bg-neutral-100")
                    }
                    if (!colChild.classList.contains("bg-blue-100/50") && colChild!=cellule){
                        colChild.classList.add("bg-blue-100/50")
                        colChild.classList.add("hover:bg-blue-200/50")
                        colChild.classList.remove("hover:bg-neutral-100")
                    }
                } else{ //décolore les cases
                    zoneChild.classList.remove("bg-blue-100/50")
                    if (!zoneChild.classList.contains("hover:bg-neutral-100")){
                        zoneChild.classList.add("hover:bg-neutral-100")
                    }
                    zoneChild.classList.remove("hover:bg-blue-200/50")
                    rowChild.classList.remove("bg-blue-100/50")
                    if (!rowChild.classList.contains("hover:bg-neutral-100")){
                        rowChild.classList.add("hover:bg-neutral-100")
                    }
                    rowChild.classList.remove("hover:bg-blue-200/50")
                    colChild.classList.remove("bg-blue-100/50")
                    if (!colChild.classList.contains("hover:bg-neutral-100")){
                        colChild.classList.add("hover:bg-neutral-100")
                    }
                    colChild.classList.remove("hover:bg-blue-200/50")
                }
            }

        }

        function CelluleUnselect(){
            if (SelectedCellule!=null){
                SelectedCellule.classList.remove("cellule-selected")
                SelectedCellule.classList.remove("bg-blue-300/50")
                if (!SelectedCellule.classList.contains("hover:bg-neutral-100")){
                    SelectedCellule.classList.add("hover:bg-neutral-100")
                }
                SelectedCellule.classList.remove("hover:bg-blue-400/50")

                ColorRegions(SelectedCellule, "uncolor")
                SelectedCellule=null
            }
        }

        function CelluleSelect(cellule){
            if (cellule==SelectedCellule){ //cas double-click ou click sur une cellule déjà sélectionnée (équivalent)
                if (SelectedUtility!=null && cellule.innerText==""){
                    if (SelectedUtility.id[0]=='v'){
                        AddValue(parseInt(cellule.id.slice(8)), parseInt(SelectedUtility.id.slice(7)))
                    }
                    if (SelectedUtility.id[0]=='c'){
                        AddCandidate(parseInt(cellule.id.slice(8)), parseInt(SelectedUtility.id.slice(11)))
                    }
                }
            } else{ //cas click simple
                CelluleUnselect()
                SelectedCellule= cellule
                SelectedCellule.classList.add("cellule-selected")
                SelectedCellule.classList.add("bg-blue-300/50")
                SelectedCellule.classList.add("hover:bg-blue-400/50")
                SelectedCellule.classList.remove("hover:bg-neutral-100")
                ColorRegions(cellule)
            }
        }
        
        //-----FORMAT CELLULE SELECTED:-----
        //on ajoute aux voisins "bg-blue-100/50 hover:bg-blue-200/50" à class
        //on ajoute au selectionné "cellule-selected bg-blue-300/50 hover:bg-blue-400/50" à class

        function SwitchUtilities(event){
            if (event.button==1){
                let id
                let num
                if (SelectedUtility==null){
                    id= "values-"
                    num= 1
                }else if (SelectedUtility.id[0]=='v'){
                    id= "candidates-"
                    num= parseInt(SelectedUtility.id.slice(7))
                } else {
                    id= "values-"
                    num= parseInt(SelectedUtility.id.slice(11))
                }
                UtilitiesSelect(document.getElementById(id+num))
            }
        }

        function ScrollUtilities(event){
            if (SelectedUtility!=null){
                let id
                let num
                if (SelectedUtility.id[0]=='v'){
                    id= "values-"
                    num= parseInt(SelectedUtility.id.slice(7))
                } else {
                    id= "candidates-"
                    num= parseInt(SelectedUtility.id.slice(11))
                }
                if (event.deltaY>0 && num<9){
                    UtilitiesSelect(document.getElementById(id+(num+1)))
                }
                if (event.deltaY<0 && num>1){
                    UtilitiesSelect(document.getElementById(id+(num-1)))
                }
            }
        }

        function UtilitiesUnselect(){
            if (SelectedUtility!=null){
                SelectedUtility.classList.remove("utilities-selected")
                SelectedUtility.classList.remove("bg-blue-300/50")
                if (!SelectedUtility.classList.contains("hover:bg-neutral-100")){
                    SelectedUtility.classList.add("hover:bg-neutral-100")
                }
                SelectedUtility.classList.remove("hover:bg-blue-400/50")
                SelectedUtility= null
            }
        }

        function UtilitiesSelect(button){
            UtilitiesUnselect()
            SelectedUtility=button
            SelectedUtility.classList.add("utilities-selected")
            SelectedUtility.classList.add("bg-blue-300/50")
            SelectedUtility.classList.add("hover:bg-blue-400/50")
            SelectedUtility.classList.remove("hover:bg-neutral-100")
        }
        //-----FORMAT UTILITIES SELECTED:-----
        //on ajoute "utilities-selected bg-blue-300/50 hover:bg-blue-400/50" à class

        function UnselectCellule(event){
            if (!event.target.classList.contains("cellule")){
                CelluleUnselect()
            }
        }

        function UnSelectUtilities(event){
            event.preventDefault()
            UtilitiesUnselect()
        }



        //-------------------------Ecouteurs d'évènement----------------------------------
        //Format pour le focus: FocusLock(nomDeLaFonction, null, argumentsDeLaFonction) si la fonction ne doit pas fonctionner quand focus
        //                      FocusLock(nomDeLaFonction, objetFocusé, argumentsDeLaFonction) si la fonction doit fonctionner lorsque objetFocusé est la cible du focus
        anonymousInfosButton.addEventListener("click", () => {FocusLock(CloseInfos, null, CloseInfos)})
        menuButton.addEventListener("click", () => {FocusLock(OpenMenu, null, OpenMenu)})
        playButton.addEventListener("click", () => {FocusLock(ChooseDifficulte, null, ChooseDifficulte)})
        loginButton.addEventListener("click", () => {FocusLock(OpenLogin, loginMenu, OpenLogin)})
        loginSubmit.addEventListener("click", () => {FocusLock(Login, loginMenu, Login)})
        logoutButton.addEventListener("click", () => {FocusLock(Logout, null, Logout)})

        difficulteFacile.addEventListener("click", () => {FocusLock(Play, null, "facile")})
        difficulteMoyen.addEventListener("click", () => {FocusLock(Play, null, "moyen")})
        difficulteDifficile.addEventListener("click", () => {FocusLock(Play, null, "difficile")})
        difficulteExtreme.addEventListener("click", () => {FocusLock(Play, null, "extreme")})
        difficulteGodmode.addEventListener("click", () => {FocusLock(Play, null, "godmode")})

        values1.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        values2.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        values3.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        values4.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        values5.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        values6.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        values7.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        values8.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        values9.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})

        candidates1.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        candidates2.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        candidates3.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        candidates4.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        candidates5.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        candidates6.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        candidates7.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        candidates8.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        candidates9.addEventListener("click", (event) => {FocusLock(UtilitiesSelect, null, event.target)})
        document.addEventListener("click", (event) => {FocusLock(UnselectCellule, null, event)}) //click gauche
        document.addEventListener("contextmenu", (event) => {FocusLock(UnSelectUtilities, null, event)}) //contextmenu c'est le menu quand tu fait click droit sur une page donc ça sert à détecter le click droit 
        document.addEventListener("wheel", (event) => {FocusLock(ScrollUtilities, null, event)}) //scroll de la souris (l'évènement 'scroll' correspond au scroll de la page)
        document.addEventListener("mouseup", (event) => {FocusLock(SwitchUtilities, null, event)}) // sert à détecter le click du milieu dans ce cas là
        //Todo/idee: faire une fonction qui prend la fonction à éxecuter en entrée et vérifie si il y a un objet focus avant de l'éxecuter
        //Cela évite de devoir faire 'if (!Focused)' à chaque début de fonction qui est appelée par un evenlistener



        //-------------------------Communication Serveur----------------------------------
        socket.on('play', data => {
            //format data: {'grille': Grille,
            //'solution': Grille,
            //'taille': int,
            //'stats': {'solved', 'stuck', 'steps', 'counts', 'maxTechnique', 'history'},
            //'difficulteEstimee': [Humanrated, sudokuCoachRated]}
            console.log("grille: ", data.grille)
            if (sudokuFrame.children.length==0){
                let grille= document.createElement("div")
                grille.classList.add("grid")
                grille.classList.add("grid-rows-3")
                grille.id= "sudoku-grid"
                sudokuFrame.appendChild(grille)
                for (let i=0; i<data.taille**2;i++){
                    let zoneRow= Math.floor(i/data.taille)
                    let zoneRowIndex= i%data.taille
                    let zone= document.createElement("div")
                    zone.classList.add("zone")
                    zone.classList.add("grid")
                    zone.classList.add("grid-rows-3")
                    zone.classList.add("row-start-"+(zoneRow+1))
                    zone.id="zone-"+i
                    grille.appendChild(zone)
                    for (let j=0; j<data.taille**2;j++){
                        let celluleZoneRow= Math.floor(j/data.taille)
                        let celluleRowIndex= j%data.taille + data.taille*zoneRowIndex
                        let celluleRow= zoneRow*data.taille + celluleZoneRow
                        let celluleIndex= celluleRowIndex + (data.taille**2)*celluleRow
                        let cellule= document.createElement("button")
                        cellule.type="button"
                        cellule.classList.add("cellule")
                        cellule.classList.add("row-start-"+(celluleZoneRow+1))
                        cellule.classList.add("border-stone-300")
                        cellule.classList.add("hover:bg-neutral-100")
                        cellule.id="cellule-"+celluleIndex
                        cellule.addEventListener("click", (event) => {CelluleSelect(event.target)})
                        zone.appendChild(cellule)
                    }
                }
            }
            for (let i=0; i<data.taille**4;i++){
                let cellule=document.getElementById("cellule-"+i)
                if (data.grille[i]==0){
                    cellule.innerText= ""
                }else{
                    cellule.innerText= data.grille[i]
                }
            }
        })
        //-------FORMAT GRILLE:--------------
        //<div class="grid grid-rows-3" id="sudoku-grid"></div>
        //-------FORMAT ZONES:---------------
        //<div class="zone grid grid-rows-3 row-start-rowNumber"></div>
        // en remplaçant rowNumber par le numéro de la ligne à laquelle la zone appartient (de 1 à 3)
        //-------FORMAT CELLULES:-------------
        //<button type="button" class="cellule row-start-zoneRowNumber border-stone-300 hover:bg-neutral-100"></button>
        // en remplaçant zoneRowNumber par le numéro de la ligne à laquelle la cellule appartient relatif à la zone(donc ça va de 1 à 3 et non pas jusqu'à 9)


        socket.on('info', data => {
            console.log(data.data)
        })
    </script>
